{% comment %}
Botón principal. Uso: {% include "emails/_tequio_button.html" with url=... label="Aceptar invitación" %}
{% endcomment %}<table
  role="presentation"
  cellspacing="0"
  cellpadding="0"
  border="0"
  style="margin: 0 0 24px;"
>
  <tr>
    <td>
      <a
        href="{{url}}"
        target="_blank"
        style="
          background-color: #006399;
          border-radius: 6px;
          color: #ffffff;
          padding: 12px 24px;
          text-align: center;
          text-decoration: none;
          display: inline-block;
          font-size: 16px;
          font-weight: 500;
          white-space: nowrap;
        "
      >
        {{label}}
      </a>
    </td>
  </tr>
</table>
