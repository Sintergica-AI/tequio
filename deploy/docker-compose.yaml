# Tequio · stack completo para el VPS de un cliente.
#
# Este fichero NO se edita en el servidor: lo reemplaza cada actualización con
# el que viene dentro de la imagen de release. Todo lo que cambia entre clientes
# vive en `tequio.env`; todo lo que cambia entre versiones vive en
# `state/version.env` (TEQUIO_VERSION). Si editas aquí, tu cambio desaparece en
# la siguiente actualización — cámbialo en el repo.
#
# TEQUIO_VERSION va con `:?`: sin versión resuelta, compose ABORTA en vez de
# intentar descargar una imagen con la etiqueta vacía.

x-tequio-image-backend: &backend-image
  image: ${TEQUIO_REGISTRY:-ghcr.io}/${TEQUIO_NAMESPACE:-sintergica-ai}/tequio-backend:${TEQUIO_VERSION:?falta TEQUIO_VERSION (state/version.env)}

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?falta AWS_ACCESS_KEY_ID}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?falta AWS_SECRET_ACCESS_KEY}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  # 100 MB: el gestor de archivos admite ficheros de ese tamaño y el proxy es
  # quien corta primero. Con el 5 MB de fábrica el drive falla sin explicación.
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-104857600}
  CERT_EMAIL: ${CERT_EMAIL:-}
  CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
  CERT_ACME_DNS: ${CERT_ACME_DNS:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:?falta SITE_ADDRESS (dominio de la instancia)}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?falta LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:?falta WEB_URL}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?falta CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:-}
  SECRET_KEY: ${SECRET_KEY:?falta SECRET_KEY}
  AMQP_URL: ${AMQP_URL:-}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  # --- Módulos propios de Tequio ---
  # Límite del gestor de archivos. Tiene que ir acompasado con FILE_SIZE_LIMIT
  # del proxy: si el proxy corta antes, el error llega sin explicación.
  DRIVE_FILE_SIZE_LIMIT: ${DRIVE_FILE_SIZE_LIMIT:-104857600}
  # Tope de tokens del asistente por workspace y mes.
  ASSISTANT_MONTHLY_TOKEN_CAP: ${ASSISTANT_MONTHLY_TOKEN_CAP:-5000000}
  ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-1}

services:
  web:
    image: ${TEQUIO_REGISTRY:-ghcr.io}/${TEQUIO_NAMESPACE:-sintergica-ai}/tequio-web:${TEQUIO_VERSION:?}
    restart: unless-stopped
    depends_on: [api, worker]

  space:
    image: ${TEQUIO_REGISTRY:-ghcr.io}/${TEQUIO_NAMESPACE:-sintergica-ai}/tequio-space:${TEQUIO_VERSION:?}
    restart: unless-stopped
    depends_on: [api, worker, web]

  admin:
    image: ${TEQUIO_REGISTRY:-ghcr.io}/${TEQUIO_NAMESPACE:-sintergica-ai}/tequio-admin:${TEQUIO_VERSION:?}
    restart: unless-stopped
    depends_on: [api, web]

  live:
    image: ${TEQUIO_REGISTRY:-ghcr.io}/${TEQUIO_NAMESPACE:-sintergica-ai}/tequio-live:${TEQUIO_VERSION:?}
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on: [api, web]

  api:
    <<: *backend-image
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [plane-db, plane-redis, plane-mq]

  worker:
    <<: *backend-image
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  beat-worker:
    <<: *backend-image
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [api, plane-db, plane-redis, plane-mq]

  # No se levanta con `up`: lo invoca el actualizador con `run --rm migrator`
  # ANTES de recrear api/worker/beat. Si no, esos tres se quedan colgados en
  # wait_for_migrations y la instancia no vuelve.
  migrator:
    <<: *backend-image
    profiles: ["tools"]
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env]
    depends_on: [plane-db, plane-redis]

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    # Upstream usa `latest` y así se instaló producción; se deja igual para no
    # cambiar de binario bajo unos datos existentes. MINIO_IMAGE_TAG permite
    # fijarlo por instancia sin tocar este fichero (que se sobreescribe al
    # actualizar).
    image: minio/minio:${MINIO_IMAGE_TAG:-latest}
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export

  proxy:
    image: ${TEQUIO_REGISTRY:-ghcr.io}/${TEQUIO_NAMESPACE:-sintergica-ai}/tequio-proxy:${TEQUIO_VERSION:?}
    restart: unless-stopped
    environment:
      <<: *proxy-env
    ports:
      - target: 80
        published: ${LISTEN_HTTP_PORT:-80}
        protocol: tcp
        mode: host
      - target: 443
        published: ${LISTEN_HTTPS_PORT:-443}
        protocol: tcp
        mode: host
    volumes:
      - proxy_config:/config
      - proxy_data:/data
      # Código fuente correspondiente (AGPL §13) de la versión EN EJECUCIÓN.
      # Lo deja ahí el actualizador sacándolo de la imagen de release, así que
      # corresponde por construcción a los binarios que se están sirviendo.
      - ${TEQUIO_HOME:-/opt/tequio}/source/public:/srv/source:ro
    depends_on: [web, api, space, admin, live]

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
